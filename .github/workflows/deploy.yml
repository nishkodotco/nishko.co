name: Deploy Next.js site to GitHub Pages

# Builds the site and uploads it straight to GitHub Pages (Settings → Pages →
# Source: GitHub Actions). The compiled site is never committed to any branch.

on:
  push:
    branches: ["main"]
  # Fired by blogs-latex's publish workflow whenever a post is published or updated.
  repository_dispatch:
    types: [blogs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (fetches latest posts from the blogs repo)
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
